version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres-account:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: account_pass
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user -d account_db"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres-transaction:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: transaction_user
      POSTGRES_PASSWORD: transaction_pass
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction_user -d transaction_db"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres-ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_pass
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres-fraud:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 6

  otel-collector:
    image: otel/opentelemetry-collector:0.103.0
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.3
    ports:
      - "3007:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/gateway
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      ACCOUNT_SERVICE_URL: http://account-service:3002
      LEDGER_SERVICE_URL: http://ledger-service:3003
      TRANSACTION_SERVICE_URL: http://transaction-service:3004
      JWT_ACCESS_SECRET: dev_access_secret
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOG_LEVEL: info
    # expose on localhost only (nginx will proxy to it if needed)
    ports:
      - "127.0.0.1:3008:3000"
    depends_on:
      auth-service:
        condition: service_started
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started
      transaction-service:
        condition: service_started
      fraud-service:
        condition: service_started
      notification-service:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/auth-service
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://auth_user:auth_pass@postgres-auth:5432/auth_db
      JWT_ACCESS_SECRET: dev_access_secret
      JWT_REFRESH_SECRET: dev_refresh_secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOG_LEVEL: info
    expose:
      - "3001"
    depends_on:
      postgres-auth:
        condition: service_healthy

  account-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/account-service
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://account_user:account_pass@postgres-account:5432/account_db
      KAFKA_BROKER: kafka:9092
      OTEL_SERVICE_NAME: account-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOG_LEVEL: info
    expose:
      - "3002"
    depends_on:
      postgres-account:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ledger-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/ledger-service
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://ledger_user:ledger_pass@postgres-ledger:5432/ledger_db
      OTEL_SERVICE_NAME: ledger-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOG_LEVEL: info
    expose:
      - "3003"
    depends_on:
      postgres-ledger:
        condition: service_healthy

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/transaction-service
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://transaction_user:transaction_pass@postgres-transaction:5432/transaction_db
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: transaction-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOG_LEVEL: info
    expose:
      - "3004"
    depends_on:
      postgres-transaction:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  fraud-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/fraud-service
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://fraud_user:fraud_pass@postgres-fraud:5432/fraud_db
      KAFKA_BROKER: kafka:9092
      OTEL_SERVICE_NAME: fraud-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOG_LEVEL: info
    expose:
      - "3005"
    depends_on:
      postgres-fraud:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE_PATH: services/notification-service
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://notification_user:notification_pass@postgres-notification:5432/notification_db
      KAFKA_BROKER: kafka:9092
      OTEL_SERVICE_NAME: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      LOG_LEVEL: info
    expose:
      - "3006"
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    # expose UI on localhost only (nginx will proxy)
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      gateway:
        condition: service_started
